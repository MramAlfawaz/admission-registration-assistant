# Run the assistant and the pinned model server on any machine with Docker:
#   docker compose -f docker/docker-compose.yml up --build
# then open http://localhost:5001 (the first build downloads about 3 GB).
services:
  ollama:
    image: ollama/ollama:0.35.0
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-pull:
    image: ollama/ollama:0.35.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/ollama", "pull", "qwen2.5:3b"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "5001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama-models:
